# Codemagic CI for مُدبِّر — https://docs.codemagic.io/yaml-quick-start/building-a-flutter-app/
#
# Workflows:
#   android-debug  → APK you can install directly (no signing setup needed)
#   ios-simulator  → unsigned build that proves the iOS app compiles
#   release        → signed AAB + IPA (needs the signing setup described below)

definitions:
  env: &flutter_env
    flutter: stable
    xcode: latest
    cocoapods: default
  scripts:
    - &get_deps
      name: Get packages
      script: flutter pub get
    - &analyze
      name: Analyze
      script: flutter analyze
    - &test
      name: Unit tests
      script: flutter test

workflows:
  android-debug:
    name: Android debug APK
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      <<: *flutter_env
    triggering:
      events: [push, pull_request]
      branch_patterns:
        - pattern: '*'
    scripts:
      - *get_deps
      - *analyze
      - *test
      - name: Build APK
        script: flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/*.apk

  ios-simulator:
    name: iOS build check (unsigned)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      <<: *flutter_env
    scripts:
      - *get_deps
      - name: Pods
        script: cd ios && pod install --repo-update
      - name: Build for simulator
        script: flutter build ios --simulator --debug
    artifacts:
      - build/ios/iphonesimulator/*.app

  # iOS → TestFlight. Needs (see README): an App Store Connect API key added in
  # Codemagic as "mudabbir_asc", and an iOS distribution certificate in
  # Codemagic → Code signing identities. Profiles are fetched automatically.
  ios-release:
    name: iOS release (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      app_store_connect: mudabbir_asc
    environment:
      <<: *flutter_env
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.mudabbir.mudabbir
    scripts:
      - *get_deps
      - *test
      - name: Pods
        script: cd ios && pod install --repo-update
      - name: Xcode signing profiles
        script: xcode-project use-profiles
      - name: Build IPA
        script: flutter build ipa --release --build-number=$PROJECT_BUILD_NUMBER --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  # Android → AAB for Google Play. Needs a keystore in Codemagic → Code signing
  # identities with reference name "mudabbir_keystore".
  android-release:
    name: Android release (AAB)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      <<: *flutter_env
      android_signing:
        - mudabbir_keystore
    scripts:
      - *get_deps
      - *test
      - name: Build AAB
        script: flutter build appbundle --release --build-number=$PROJECT_BUILD_NUMBER
    artifacts:
      - build/app/outputs/bundle/release/*.aab
